name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  zsh-tests:
    name: Zsh syntax and fixture tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh

      - name: Run syntax checks and fixture tests
        run: ./run check
